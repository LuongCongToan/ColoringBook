# The coloring-page backend for ColoringBook (docs/worker-security.md).
#
# There are no secrets in this file and there must never be any. The one
# secret is set out of band:
#
#   npx wrangler secret put BFL_API_KEY
#   npx wrangler secret put BFL_API_KEY --env staging
#
# Deploy with `npm run deploy` / `npm run deploy:staging`, which refuse to
# ship if a test fails.

name = "coloring-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true
# No per-version preview URLs: one public address per Worker.
preview_urls = false

[vars]
ENVIRONMENT = "production"
# The fuse: pages per UTC day across every user. At about $0.01-0.02 a page
# this caps a day's bill near $10. Start low; raise it as subscribers arrive.
GLOBAL_DAILY_CAP = "500"
# Pages per UTC day shared by every sandbox transaction. App Review buys in
# the sandbox and exercises the production Worker, so "0" here means the
# reviewer sees the paid feature fail. See README.md, "Sandbox".
SANDBOX_DAILY_CAP = "50"

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaCounter"]

# TEMPORARY. Debug builds in the Simulator, with Products.storekit. It skips
# the StoreKit signature check, so anyone with the URL can spend its cap:
# keep GLOBAL_DAILY_CAP tiny. Once real sandbox purchases work against
# production, delete it: `npx wrangler delete --env staging`, then remove
# this block and point Debug builds at production.
[env.staging]
name = "coloring-api-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
STAGING_SKIP_SIGNATURE = "true"
GLOBAL_DAILY_CAP = "5"
SANDBOX_DAILY_CAP = "5"

[[env.staging.durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaCounter"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaCounter"]
